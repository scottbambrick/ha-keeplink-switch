name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  lint:
    # Code style: ruff, formatted the way Home Assistant core is (Black style, 88 columns).
    # If anything is off, the format-fixes artifact holds a patch with the formatters' changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the formatters
        run: pip install "ruff==0.16.10"
      - name: Run the formatters
        run: |
          ruff check --fix --exit-zero --quiet .
          ruff format --quiet .
          git diff > format-fixes.patch
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: format-fixes
          path: format-fixes.patch
      - name: Check formatting
        run: git diff --stat --exit-code
      - name: Python lint (ruff check)
        if: ${{ !cancelled() }}
        run: ruff check --output-format=github .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pytest
      - run: pytest
